# --- FILE: docker-compose.prod.yml ---
# Продакшен: docker compose -f docker-compose.prod.yml up -d --build
# Настройки и секреты — в .env (шаблон .env.example, инструкция — DEPLOY.md).
#
# Наружу открыт только web (nginx, порт 80): API, БД и Redis доступны лишь внутри сети compose.
# Поэтому API может доверять X-Forwarded-For от любого адреса этой сети (FORWARDED_ALLOW_IPS).

# Имя проекта задано явно: тома и сеть называются regence_*, а не по имени папки.
name: regence

x-backend: &backend
  build: .
  image: regence-backend:latest
  env_file: .env
  environment: &backend-env
    ENVIRONMENT: production
    POSTGRES_SERVER: db
    POSTGRES_PORT: "5432"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
  restart: unless-stopped
  # Консоль контейнера — json-строки src/core/logging_setup.py; драйвер хранит 5 файлов по 20 МБ и ротирует их сам.
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    # AOF: состояние идущих партий и очередь Celery переживают перезапуск Redis.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Одноразовый сервис: применяет миграции до старта API и воркера и загружает базу задач (повторно — безопасно).
  migrate:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.import_puzzles"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    environment:
      ENVIRONMENT: production
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      FORWARDED_ALLOW_IPS: "*"
      # Метрики Prometheus суммируются по всем процессам uvicorn через файлы в этом каталоге.
      # tmpfs очищается при каждом старте контейнера — значения умерших процессов не копятся.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    tmpfs:
      - /tmp/prometheus:mode=1777
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Фоновый анализ завершённых партий (Stockfish).
  worker:
    <<: *backend
    command: ["celery", "-A", "src.worker.celery_app", "worker", "--loglevel=INFO",
              "--concurrency=${CELERY_CONCURRENCY:-2}", "-Q", "analysis", "-n", "analysis@%h"]
    # Метрики фонового анализа (время движка) — на worker:9101/metrics; свой tmpfs, а не общий с api: номера
    # процессов в контейнерах совпадают (src/core/observability.start_worker_metrics_server).
    # environment сервиса заменяет общий целиком (слияние YAML неглубокое), поэтому общий подмешан явно.
    environment: &worker-metrics
      <<: *backend-env
      WORKER_METRICS_PORT: "9101"
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    tmpfs:
      - /tmp/prometheus:mode=1777
    # Stockfish занимает все доступные ядра; без предела анализ партий отбирает CPU у API, и при
    # массовом завершении партий p95 задержки хода вырастал с ~70 до ~230 мс (scripts/loadtest).
    cpus: ${WORKER_CPUS:-1.0}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Партии ботов между собой в турнирах (таск 15.2) — отдельная очередь и отдельный воркер (таск A.4): турнир на 8
  # (до 28 партий) не задерживает разбор партий игроков. Одна партия за раз и свой предел CPU.
  worker-simulation:
    <<: *backend
    command: ["celery", "-A", "src.worker.celery_app", "worker", "--loglevel=INFO",
              "--concurrency=${SIMULATION_CONCURRENCY:-1}", "-Q", "simulation", "-n", "simulation@%h"]
    environment: *worker-metrics
    tmpfs:
      - /tmp/prometheus:mode=1777
    cpus: ${SIMULATION_CPUS:-0.5}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Плановые задачи Celery (DEPLOY.md, раздел 8в): напоминание о разминке раз в день, самоигра ботов каждые
  # 6 часов, напоминания о начале арен каждую минуту. Один процесс beat на весь стек.
  beat:
    <<: *backend
    command: ["celery", "-A", "src.worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    cpus: 0.1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Резервные копии БД: pg_dump сразу при старте и затем каждые BACKUP_INTERVAL_HOURS часов
  # в папку хоста BACKUP_DIR; копии старше BACKUP_KEEP_DAYS дней удаляются (DEPLOY.md, раздел 5).
  backup:
    image: postgres:16-alpine
    entrypoint: ["sh", "/usr/local/bin/pg_backup.sh"]
    command: ["loop"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGHOST: db
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_VERIFY_EVERY_DAYS: ${BACKUP_VERIFY_EVERY_DAYS:-7}
      BACKUP_ALERT_WEBHOOK_URL: ${BACKUP_ALERT_WEBHOOK_URL:-}
    volumes:
      - ./scripts/backup/pg_backup.sh:/usr/local/bin/pg_backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Копия снимков вне сервера (rclone: S3, Backblaze B2, Google Drive, SFTP и др.). Включается профилем:
  #   docker compose -f docker-compose.prod.yml --profile offsite up -d
  # Хранилище `offsite` описывается переменными RCLONE_CONFIG_OFFSITE_* в .env (DEPLOY, раздел 5); пока их нет,
  # сервис не нужен. Копируются только готовые regence_*.dump: `.partial` и служебные файлы не попадают.
  backup-offsite:
    image: rclone/rclone:1.68.2
    profiles: ["offsite"]
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          rclone copy /backups "$${BACKUP_OFFSITE_PATH:?}" --include 'regence_*.dump' --exclude '*'             || echo "backup-offsite: ERROR: rclone copy failed"
          sleep "$$(( $${BACKUP_OFFSITE_INTERVAL_HOURS:-24} * 3600 ))"
        done
    env_file: .env
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups:ro
    depends_on:
      - backup
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}  # Sentry страницы (проект regence-web); пусто — выключен
    image: regence-web:latest
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
