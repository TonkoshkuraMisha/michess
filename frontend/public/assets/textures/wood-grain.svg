<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Процедурная текстура древесных волокон: собственная работа проекта michess, CC0. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.009 0.32" numOctaves="4" seed="11" result="fibres"/>
    <feColorMatrix in="fibres" type="matrix" values="0 0 0 0 0.30  0 0 0 0 0.19  0 0 0 0 0.10  0.9 0.5 0 0 -0.25"/>
  </filter>
  <rect width="512" height="512" fill="#d2ad78"/>
  <rect width="512" height="512" filter="url(#grain)"/>
</svg>
