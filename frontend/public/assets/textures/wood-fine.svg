<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Мелкие древесные волокна (светлое и тёмное дерево): собственная работа проекта regence, CC0. -->
  <filter id="f" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.28" numOctaves="4" seed="7" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.35  0 0 0 0 0.35  1.2 0 0 0 -0.45"/>
  </filter>
  <rect width="512" height="512" fill="#ffffff"/>
  <rect width="512" height="512" filter="url(#f)"/>
</svg>
