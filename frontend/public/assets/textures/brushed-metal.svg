<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Шлифованный металл: собственная работа проекта regence, CC0. -->
  <filter id="f" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.002 0.75" numOctaves="2" seed="3" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.4  0 0 0 0 0.4  0 0 0 0 0.4  1.4 0 0 0 -0.55"/>
  </filter>
  <rect width="512" height="512" fill="#ffffff"/>
  <rect width="512" height="512" filter="url(#f)"/>
</svg>
