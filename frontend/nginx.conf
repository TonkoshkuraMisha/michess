# --- FILE: frontend/nginx.conf ---
# Статика SPA + прокси API и WebSocket на сервис api (docker-compose.prod.yml).
# TLS здесь не настраивается: его обычно завершает внешний балансировщик или отдельный
# прокси (Caddy, Traefik, облачный LB). Если HTTPS завершается прямо здесь — добавьте
# listen 443 ssl и раскомментируйте Strict-Transport-Security ниже.

# Upgrade — для WebSocket; для обычных запросов пустой Connection сохраняет keepalive до API.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

# Адрес api перечитывается из DNS Docker (127.0.0.11), а не берётся один раз при старте nginx:
# пересозданный при деплое или упавший и перезапущенный контейнер API может получить новый IP,
# и nginx со старым адресом отдавал бы 502 на всё, пока его не перезапустят вручную.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream michess_api {
    zone michess_api 64k;
    server api:8000 resolve;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # --- Заголовки безопасности (add_header в location отменяет унаследованные, поэтому
    #     вынесены в отдельный файл и подключаются в каждом location со своими add_header).
    include /etc/nginx/conf.d/security_headers.inc;

    # --- API и WebSocket ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://michess_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Перезаписываем, а не дописываем: клиент не может подставить свой X-Forwarded-For
        # и обойти лимиты по IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # WebSocket партии живёт долго; сервер сам рвёт мёртвые соединения по ping/pong.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /health {
        proxy_pass http://michess_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Статика ---------------------------------------------------------------------------
    # Файлы сборки Vite с хэшем в имени не меняются — кэшируем надолго.
    location /assets/ {
        include /etc/nginx/conf.d/security_headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: любые клиентские маршруты (/game/123, /profile/...) отдают index.html.
    location / {
        include /etc/nginx/conf.d/security_headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
