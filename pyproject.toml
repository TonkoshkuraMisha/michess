# --- FILE: pyproject.toml ---
# Настройки инструментов качества кода (pytest настроен в pytest.ini).
# Проверка локально:  ruff check . ; ruff format --check не используется (форматирование не навязываем)
#                     mypy ; pytest --cov

[project]
name = "michess"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.19.0",
    "amqp==5.3.1",
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    "asyncpg==0.31.0",
    "bcrypt==4.0.1",
    "billiard==4.2.4",
    "celery==5.6.3",
    "celery-types==0.26.0",
    "certifi==2026.7.22",
    "charset-normalizer==3.4.9",
    "chess==1.11.2",
    "click==8.4.2",
    "click-didyoumean==0.3.1",
    "click-plugins==1.1.1.2",
    "click-repl==0.3.0",
    "colorama==0.4.6",
    "fastapi==0.141.1",
    "greenlet==3.5.4",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httptools==0.8.0",
    "httpx==0.28.1",
    "idna==3.18",
    "kombu==5.6.2",
    "mako==1.4.3",
    "markupsafe==3.0.3",
    "packaging==26.3",
    "passlib==1.7.4",
    "prometheus-client==0.26.0",
    "prompt-toolkit==3.0.53",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "pydantic-settings==2.14.2",
    "pygments==2.20.0",
    "pyjwt==2.13.0",
    "python-chess==1.999",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "redis==8.1.0",
    "requests==2.34.2",
    "sentry-sdk==2.74.0",
    "six==1.17.0",
    "sqlalchemy==2.0.51",
    "starlette==1.3.1",
    "stockfish==5.2.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.2",
    "tzdata==2026.3",
    "tzlocal==5.4.4",
    "urllib3==2.7.0",
    "uvicorn==0.52.1",
    "vine==5.1.0",
    "watchfiles==1.2.0",
    "wcwidth==0.8.2",
    "websockets==17.0.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 127
extend-exclude = ["michess_env", "frontend", "_project_snapshot"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: неиспользуемое, неопределённые имена
    "I",        # порядок импортов
    "B",        # bugbear: типичные ошибки
    "UP",       # современный синтаксис Python 3.11
    "ASYNC",    # блокирующие вызовы и ошибки в async-коде
    "SIM",      # упрощения
    "PT",       # стиль pytest
]
ignore = [
    "SIM105",   # contextlib.suppress вместо try/except/pass — дело вкуса
    "SIM108",   # тернарный оператор вместо if/else — часто хуже читается
    "PT006",    # тип первого аргумента parametrize — дело вкуса
    "PT011",    # pytest.raises(ValueError) без match — допустимо в простых проверках
    "PT018",    # составной assert — допустимо в тестах
    "UP042",    # (str, Enum) -> StrEnum меняет str(): GameStatus.X стал бы "x" — не трогаем молча
]

[tool.ruff.lint.per-file-ignores]
# Старые миграции не переписываем: длинные строки SQL и автогенерированный код.
"migrations/versions/*.py" = ["E501", "W291"]

[tool.ruff.lint.flake8-bugbear]
# Depends()/Query() в значениях по умолчанию — штатный способ объявлять зависимости FastAPI.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Header", "fastapi.Form",
    "fastapi.security.OAuth2PasswordRequestForm",
]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.mypy]
python_version = "3.14"
files = ["src"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.coverage.run]
source = ["src"]
omit = ["src/db/seed.py"]  # загрузка архивов партий из сети, в тестах не запускается
# SQLAlchemy asyncio выполняет запросы в greenlet: без greenlet-трассировки код эндпоинтов после
# первого await к БД считался непокрытым, и покрытие API-слоя занижалось на 20–30 п.п.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
# Текущий уровень ~84% (с greenlet-трассировкой); порог чуть ниже, чтобы мелкие колебания
# не роняли CI, но заметное падение покрытия (код без тестов) — роняло.
fail_under = 82
show_missing = false
skip_covered = true
precision = 1

[dependency-groups]
dev = [
    "aiosqlite==0.22.1",
    "coverage==7.17.2",
    "fakeredis==2.37.0",
    "iniconfig==2.3.0",
    "mypy==2.4.1",
    "pillow==13.0.0",
    "pluggy==1.6.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
    "sortedcontainers==2.4.0",
]
