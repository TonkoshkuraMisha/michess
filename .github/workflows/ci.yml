# --- FILE: .github/workflows/ci.yml ---

name: Michess CI

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

jobs:
  test:
    name: Run Tests and Linters
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8.0-M02-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-asyncio httpx aiosqlite

      - name: Lint with flake8
        run: |
          python -m flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run pytest
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SECRET_KEY: test_secret_key_for_ci_only
        run: |
          python -m pytest -v