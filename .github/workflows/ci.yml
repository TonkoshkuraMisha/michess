# --- FILE: .github/workflows/ci.yml ---

name: Michess CI

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-test:
    name: Backend Tests and Linters
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Stockfish engine for Linux CI
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish
          mkdir -p bin
          if [ -f /usr/games/stockfish ]; then ln -sf /usr/games/stockfish bin/stockfish; fi
          if [ -f /usr/bin/stockfish ]; then ln -sf /usr/bin/stockfish bin/stockfish; fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Правила и исключения — в pyproject.toml. Любое замечание роняет сборку.
      - name: Lint (ruff)
        run: ruff check . --output-format github

      - name: Type check (mypy)
        run: mypy

      # Миграции применяются на отдельной пустой базе, затем alembic check сверяет
      # получившуюся схему с моделями: модель изменили, а миграцию забыли — сборка падает.
      - name: Migrations apply cleanly and match the models
        env:
          REDIS_HOST: localhost
          SECRET_KEY: test_secret_key_for_ci_only
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: ci_migrations
        run: |
          PGPASSWORD=ci_password psql -h localhost -U ci_user -d ci_db -c "CREATE DATABASE ci_migrations"
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Run pytest with coverage
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SECRET_KEY: test_secret_key_for_ci_only
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: ci_db
          # Гонки на настоящих PostgreSQL и Redis (tests/integration): FOR UPDATE, WATCH/MULTI.
          TEST_DATABASE_URL: postgresql+asyncpg://ci_user:ci_password@localhost:5432/ci_db
          TEST_REDIS_URL: redis://localhost:6379/15
        # Порог покрытия (fail_under) — в pyproject.toml.
        run: |
          python -m pytest -v --cov --cov-report=term

  frontend-test:
    name: Frontend Lint, Test and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter (oxlint)
        run: npm run lint

      - name: Run unit tests (vitest)
        run: npm run test

      - name: Build production bundle
        run: npm run build

  production-stack:
    name: Production images smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare production .env
        run: |
          cp .env.example .env
          sed -i '/^SECRET_KEY=/d; /^ENVIRONMENT=/d; /^HTTP_PORT=/d' .env
          echo "SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" >> .env
          echo "HTTP_PORT=8080" >> .env

      - name: Validate compose file
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Build images
        run: docker compose -f docker-compose.prod.yml build

      - name: Validate nginx config
        run: docker run --rm --add-host api:127.0.0.1 michess-web:latest nginx -t

      - name: Start the stack (migrations run on a fresh PostgreSQL)
        run: |
          docker compose -f docker-compose.prod.yml up -d
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health; then echo; exit 0; fi
            sleep 3
          done
          echo "Stack did not become healthy"; exit 1

      - name: Smoke test through nginx
        run: |
          set -e
          headers=$(curl -fsSI http://localhost:8080/)
          echo "$headers" | grep -qi "content-security-policy"
          curl -fsS http://localhost:8080/game/123 | grep -q '<div id="root">'
          curl -fsS -X POST http://localhost:8080/api/v1/auth/register \
            -H 'Content-Type: application/json' -d '{"username":"smoke_user","password":"smoke-pass-123"}'
          token=$(curl -fsS -X POST http://localhost:8080/api/v1/auth/login \
            -d 'username=smoke_user&password=smoke-pass-123' | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl -fsS -X POST http://localhost:8080/api/v1/auth/ws-ticket -H "Authorization: Bearer $token"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/openapi.json)" = "404"
          docker compose -f docker-compose.prod.yml exec -T api python -c \
            "from src.services.bots.base import resolve_stockfish_path as r; assert r(), 'no stockfish'; print(r())"
          docker compose -f docker-compose.prod.yml ps worker | grep -q "Up"

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color --tail=200
